---
layout: default
---
<h1>{{ page.title | escape }}</h1>
<ul class="post-list">
    {% for post in site.posts %}
    {% if post.project %}
    <li>
        <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        <p class="post-summary">{{ post.excerpt | strip_html | normalize_whitespace | truncate: 180 | escape }}</p>
    </li>
    {% endif %}
    {% endfor %}
</ul>
